# Ambiente local: API + PostgreSQL. Uso: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fatec
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fatec"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: fatec
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: "false"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
